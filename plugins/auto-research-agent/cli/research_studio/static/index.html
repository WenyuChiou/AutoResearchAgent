<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https: http://localhost:* http://127.0.0.1:* http://[::1]:*; img-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Research Studio</title>
  <link rel="stylesheet" href="studio.css">
  <script src="config.js" defer></script>
  <script src="studio.js" defer></script>
</head>
<body>
<div id="research-studio-preview" aria-label="Research Studio">
  <div class="rs-shell">
    <aside class="rs-sidebar">
      <div class="rs-brand"><span class="rs-symbol" aria-hidden="true">h</span><div>harness<small>RESEARCH STUDIO</small></div></div>
      <nav class="rs-nav" data-aria="navigation">
        <button type="button" data-view="work" class="active"><span aria-hidden="true">▦</span><span data-i18n="workspace"></span></button>
        <button type="button" data-view="files"><span aria-hidden="true">▤</span><span data-i18n="files"></span></button>
        <button type="button" data-view="history"><span aria-hidden="true">◷</span><span data-i18n="history"></span></button>
      </nav>
      <div class="rs-stage-section"><div class="rs-side-label" data-i18n="pipeline"></div><nav class="rs-stages" id="stage-nav" data-aria="stages"></nav></div>
      <div class="rs-side-footer"><button type="button" data-view="connection" class="rs-setting-button"><span data-i18n="connection"></span> ↗</button><p data-i18n="singleOwner"></p></div>
    </aside>
    <div class="rs-content">
      <header class="rs-topbar">
        <span class="rs-breadcrumb"><span data-i18n="myResearch"></span> / <span id="breadcrumb"></span></span>
        <label class="rs-language-label" for="language"><span data-i18n="language"></span><select id="language" class="rs-project-select"><option value="zh-Hans">简体中文</option><option value="en">English</option><option value="zh-Hant">繁體中文</option></select></label>
        <button type="button" id="connection-button" class="rs-badge warm"></button>
      </header>
      <main class="rs-main">
        <div id="notice" class="rs-notice" role="status" aria-live="polite" hidden></div>
        <section id="work-view">
          <nav class="rs-mobile-stages" id="mobile-stages" data-aria="stages" hidden></nav>
          <div class="rs-heading"><div><div class="rs-eyebrow" id="stage-kicker"></div><h2 id="stage-title"></h2><p id="stage-goal"></p></div><span class="rs-badge rs-heading-side" id="stage-availability"></span></div>
          <div class="rs-work-grid">
            <div>
              <div class="rs-contract"><div><span data-i18n="inputs"></span><p id="stage-inputs"></p></div><div><span data-i18n="outputs"></span><p id="stage-outputs"></p></div></div>
              <form id="run-form" class="rs-run-form">
                <div class="rs-section-label" data-i18n="runSetup"></div>
                <label for="topic" data-i18n="topic"></label><input id="topic" type="text" maxlength="4000" required autocomplete="off" data-placeholder="topicPlaceholder" list="topic-history"><datalist id="topic-history"></datalist>
                <label for="scope" data-i18n="scope"></label><textarea id="scope" maxlength="4000" rows="4" required data-placeholder="scopePlaceholder"></textarea>
                <div class="rs-timeout-row"><label for="timeout" data-i18n="timeout"></label><input id="timeout" type="number" min="60" max="3600" step="1" value="600" required><span data-i18n="seconds"></span></div>
                <p class="rs-disclosure" data-i18n="costNotice"></p>
                <label class="rs-checkbox"><input id="scope-confirmed" type="checkbox" required><span data-i18n="scopeConfirmation"></span></label>
                <button type="submit" id="run-button" class="rs-button primary" disabled data-i18n="run"></button>
                <p id="run-blocker" class="rs-disclosure"></p>
              </form>
              <section id="future-stage" class="rs-canvas" hidden><div class="rs-canvas-header"><h3 data-i18n="plannedView"></h3><span class="rs-badge" data-i18n="notIntegrated"></span></div><div class="rs-canvas-body"><div class="rs-placeholder"><div id="stage-nodes" class="rs-blueprint"></div><p data-i18n="futureNotice"></p></div></div></section>
              <section id="execution-panel" class="rs-canvas rs-execution-panel" hidden>
                <div class="rs-canvas-header"><h3 data-i18n="runEvents"></h3><span id="event-count" class="rs-badge"></span></div>
                <div id="event-log" class="rs-event-log" data-aria="runEvents"></div>
                <div class="rs-artifact-strip"><span id="artifact-summary"></span><button type="button" id="open-artifacts" class="rs-text-button" data-i18n="openArtifacts"></button></div>
              </section>
            </div>
            <aside class="rs-run-panel">
              <section><h3 data-i18n="execution"></h3><p id="stage-execution"></p></section>
              <section><h3 data-i18n="currentRun"></h3><div id="current-run"></div><div id="status-timeline" class="rs-flow"></div><button type="button" id="stop-button" class="rs-button wide" disabled data-i18n="stop"></button></section>
              <section class="rs-gate"><h3 data-i18n="reviewGate"></h3><p id="stage-gate"></p><p class="rs-disclosure" data-i18n="exitNotice"></p></section>
            </aside>
          </div>
        </section>
        <section id="files-view" hidden>
          <div class="rs-heading"><div><div class="rs-eyebrow" data-i18n="library"></div><h2 data-i18n="files"></h2><p data-i18n="filesIntro"></p></div><button type="button" id="refresh-files" class="rs-button rs-heading-side" data-i18n="refresh" disabled></button></div>
          <div class="rs-library-tools"><label class="rs-filter" for="file-run"><span data-i18n="producingRun"></span><select id="file-run"></select></label><span id="file-groups" class="rs-file-foot"></span></div>
          <div class="rs-files-grid"><div class="rs-file-browser"><div class="rs-list-top"><span data-i18n="serverArtifacts"></span><span id="file-count"></span></div><div id="file-list"></div></div><aside class="rs-inspector"><div id="file-detail"></div></aside></div>
          <p class="rs-file-foot" data-i18n="sourceLanguageNotice"></p>
        </section>
        <section id="history-view" hidden><div class="rs-heading"><div><div class="rs-eyebrow" data-i18n="history"></div><h2 data-i18n="history"></h2><p data-i18n="historyIntro"></p></div><button type="button" id="refresh-history" class="rs-button rs-heading-side" data-i18n="refresh" disabled></button></div><div class="rs-history" id="history-list"></div></section>
        <section id="connection-view" hidden>
          <div class="rs-heading"><div><div class="rs-eyebrow" data-i18n="privateApi"></div><h2 data-i18n="connection"></h2><p data-i18n="connectionIntro"></p></div></div>
          <form id="connection-form" class="rs-connection-form">
            <label for="api-url" data-i18n="apiUrl"></label><input id="api-url" type="url" required spellcheck="false" placeholder="https://research-api.example.org" autocomplete="off">
            <label for="access-token" data-i18n="token"></label><input id="access-token" type="password" required autocomplete="off" spellcheck="false">
            <p class="rs-disclosure" data-i18n="tokenNotice"></p>
            <div class="rs-action-row"><button type="submit" id="connect-button" class="rs-button primary" data-i18n="connect"></button><button type="button" id="disconnect-button" class="rs-button" disabled data-i18n="disconnect"></button></div>
          </form>
          <section class="rs-connection-health"><h3 data-i18n="serverStatus"></h3><p id="server-status"></p><p id="server-reason" class="rs-source-text"></p><p class="rs-disclosure" data-i18n="hostingNotice"></p></section>
        </section>
      </main>
      <footer class="rs-bottom"><span data-i18n="realDataNotice"></span><span id="footer-status" aria-live="polite"></span></footer>
    </div>
  </div>
</div>
</body>
</html>
