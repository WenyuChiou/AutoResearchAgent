name: Stage 1 plugin

on:
  pull_request:
    paths:
      - ".agents/plugins/marketplace.json"
      - "plugins/auto-research-agent/**"
      - ".github/workflows/stage1-plugin.yml"
  push:
    branches: [main]
    paths:
      - ".agents/plugins/marketplace.json"
      - "plugins/auto-research-agent/**"
      - ".github/workflows/stage1-plugin.yml"

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"
      - run: npm install --global @openai/codex@0.153.0
      - run: codex --version
      - name: Plugin loading and stage contracts
        run: uv run --no-project --python 3.11 --with-requirements plugins/auto-research-agent/requirements-test.txt python -m unittest discover -s plugins/auto-research-agent/tests -v
