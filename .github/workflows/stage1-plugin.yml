name: Stage 1 plugin

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate research PR explanation
        run: python .github/scripts/validate_research_pr.py

  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"
      - run: npm install --global @openai/codex@0.153.0
      - run: codex --version
      - name: Check plugin and CI Python formatting
        run: uv run --frozen --project scripts ruff format --check plugins/auto-research-agent .github/scripts/ci_scope.py .github/scripts/test_ci_scope.py .github/scripts/validate_research_pr.py .github/scripts/test_validate_research_pr.py
      - name: Check plugin and CI Python lint
        run: uv run --frozen --project scripts ruff check plugins/auto-research-agent .github/scripts/ci_scope.py .github/scripts/test_ci_scope.py .github/scripts/validate_research_pr.py .github/scripts/test_validate_research_pr.py
      - name: Check plugin spelling
        run: uvx --from codespell==2.4.3 codespell plugins/auto-research-agent .agents/plugins/marketplace.json .github/pull_request_template.md .github/scripts/ci_scope.py .github/scripts/test_ci_scope.py .github/scripts/validate_research_pr.py .github/scripts/test_validate_research_pr.py
      - name: Plugin loading and stage contracts
        run: uv run --no-project --python 3.11 --with-requirements plugins/auto-research-agent/requirements-test.txt python -m unittest discover -s plugins/auto-research-agent/tests -v
      - name: Research PR contract tests
        run: python -m unittest discover -s .github/scripts -p test_validate_research_pr.py -v
