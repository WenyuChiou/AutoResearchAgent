name: Stage 1 plugin

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plugin_test_scope: ${{ steps.select.outputs.plugin_test_scope }}
    steps:
      # pull_request executes the candidate workflow and selector. Governance
      # scope is a test-time optimization, not protection from a hostile fork.
      # Selector/workflow changes themselves are excluded from that fast path.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test scope selection and failure propagation
        run: python3 -m unittest discover -s .github/scripts -p test_ci_scope.py -v
      - id: select
        run: python3 .github/scripts/ci_scope.py

  contracts:
    needs: scope
    # A failed selector must fail these required jobs instead of skipping them.
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Full-suite run 38148254212 exceeded Ubuntu/macOS job deadlines.
    # Keep every check, with a bounded allowance only for the full scope.
    timeout-minutes: ${{ needs.scope.outputs.plugin_test_scope == 'full' && 90 || matrix.os == 'windows-latest' && 50 || matrix.os == 'macos-latest' && 30 || 20 }}
    steps:
      - name: Require a successful, recognized scope selection
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          PLUGIN_TEST_SCOPE: ${{ needs.scope.outputs.plugin_test_scope }}
        run: python -c "import os; raise SystemExit(not (os.environ['SCOPE_RESULT'] == 'success' and os.environ['PLUGIN_TEST_SCOPE'] in ('docs', 'ui', 'full', 'governance')))"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        if: ${{ needs.scope.outputs.plugin_test_scope != 'docs' && needs.scope.outputs.plugin_test_scope != 'governance' }}
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"
      - run: npm install --global @openai/codex@0.153.0
        if: ${{ needs.scope.outputs.plugin_test_scope != 'docs' && needs.scope.outputs.plugin_test_scope != 'governance' }}
      - run: codex --version
        if: ${{ needs.scope.outputs.plugin_test_scope != 'docs' && needs.scope.outputs.plugin_test_scope != 'governance' }}
      - name: Prepare single-link Python test environment
        shell: pwsh
        run: |
          # Parser inventories require physical single-link dependency files.
          # uv run can reuse an overlay with hardlinked cached packages on Windows.
          $testRoot = Join-Path $env:RUNNER_TEMP ("stage1-python-" + [guid]::NewGuid())
          uv python install --no-config 3.11
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $basePython = uv python find --no-config --no-project --managed-python 3.11
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Select the physical interpreter, not a managed-version junction.
          $basePython = python -c "import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))" $basePython
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # venv records the resolved base; uv's interpreter cache may retain the alias.
          & $basePython -I -B -m venv --copies --without-pip $testRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testBin = Join-Path $testRoot $(if ($IsWindows) { "Scripts" } else { "bin" })
          $testPython = Join-Path $testBin $(if ($IsWindows) { "python.exe" } else { "python" })
          uv pip install --no-config --python $testPython --link-mode copy --requirements plugins/auto-research-agent/requirements-test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Check plugin and CI Python formatting
        if: ${{ needs.scope.outputs.plugin_test_scope == 'ui' || needs.scope.outputs.plugin_test_scope == 'full' }}
        run: uv run --frozen --project scripts ruff format --check plugins/auto-research-agent .github/scripts/ci_scope.py .github/scripts/test_ci_scope.py .github/scripts/stage1_test_scope.py .github/scripts/test_stage1_test_scope.py .github/scripts/validate_research_pr.py .github/scripts/test_validate_research_pr.py .github/scripts/check_research_pr_dependencies.py .github/scripts/test_check_research_pr_dependencies.py .github/scripts/test_stage1_ci_quality.py
      - name: Check plugin and CI Python quality
        if: ${{ needs.scope.outputs.plugin_test_scope == 'ui' || needs.scope.outputs.plugin_test_scope == 'full' }}
        run: uv run --frozen --project scripts ruff check plugins/auto-research-agent .github/scripts/ci_scope.py .github/scripts/test_ci_scope.py .github/scripts/stage1_test_scope.py .github/scripts/test_stage1_test_scope.py .github/scripts/validate_research_pr.py .github/scripts/test_validate_research_pr.py .github/scripts/check_research_pr_dependencies.py .github/scripts/test_check_research_pr_dependencies.py .github/scripts/test_stage1_ci_quality.py
      - name: Check plugin spelling
        run: uvx --from codespell==2.4.3 codespell AGENTS.md plugins/auto-research-agent .agents/plugins/marketplace.json .github/pull_request_template.md .github/scripts/fixtures/pr_bodies .github/scripts/fixtures/pr_evidence .github/scripts/criterion-submetric-map.v1.json .github/scripts/invariant-registry.v1.json .github/scripts/ci_scope.py .github/scripts/test_ci_scope.py .github/scripts/stage1_test_scope.py .github/scripts/test_stage1_test_scope.py .github/scripts/validate_research_pr.py .github/scripts/test_validate_research_pr.py .github/scripts/check_research_pr_dependencies.py .github/scripts/test_check_research_pr_dependencies.py .github/scripts/test_stage1_ci_quality.py
      - name: Plugin loading and stage contracts
        if: ${{ needs.scope.outputs.plugin_test_scope != 'governance' }}
        env:
          PLUGIN_TEST_WORKERS: ${{ matrix.os == 'windows-latest' && 3 || 1 }}
        run: python .github/scripts/stage1_test_scope.py
      - name: Research PR contract tests
        if: ${{ needs.scope.outputs.plugin_test_scope != 'governance' }}
        run: python .github/scripts/stage1_test_scope.py --contracts
      - name: Governance scope and validator contracts
        if: ${{ needs.scope.outputs.plugin_test_scope == 'governance' }}
        run: python .github/scripts/stage1_test_scope.py --governance
